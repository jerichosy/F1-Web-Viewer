name: Dependency CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
        # Legacy webpack 4 needs OpenSSL's legacy provider on supported Node.
      - run: npm ci
      - run: npm run lint -- --no-fix src functions vue.config.js babel.config.js
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - run: node --test tests/dependency-smoke.cjs
  gate:
    name: Dependency CI Gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
